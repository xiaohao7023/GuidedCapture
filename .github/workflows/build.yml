name: Build

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build (iOS Simulator)
        run: |
          xcodebuild \
            -scheme GuidedCapture \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            build
